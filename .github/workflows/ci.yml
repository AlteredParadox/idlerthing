# Merge gate: the checks a change must pass. `make vet` (gofmt + go vet) and
# `make test` are the project's own targets, so CI runs exactly what a
# developer runs locally; the race suite runs separately because it is the
# slow part (~4 min for internal/web) and only ever needs the one invocation.
# The `grid` job drives app.js in a real browser; it is its own job so a
# JavaScript regression is attributed as one and the Go gate stays fast.
name: ci

# push only on main; branch pushes are covered by their pull_request run,
# so PRs (including Dependabot's) don't run this twice.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this job only reads the repo.
permissions:
  contents: read

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (a retagged action can't change
      # under us); the trailing comment records the tag. Keep the comment at
      # the FULL version — Dependabot only refreshes a comment that already
      # carries one, and a bare "# v7" silently goes stale as the SHA moves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # gofmt -l (fails on any unformatted file) + go vet ./...
      - name: make vet
        run: make vet

      # Every first-party source carries the AGPL notice. Cheap and offline,
      # so unlike notices-check this one is safe to gate every PR on —
      # Dependabot never touches source headers.
      - name: make license-check
        run: make license-check

      # The trimmed static binary the README documents.
      - name: make build
        run: make build

      - name: make test
        run: make test

      # The caches (dashboard/counts, prometheus, rates singleflight) are
      # concurrent by design — this is the suite that pins them.
      - name: Race tests
        run: go test -race ./...

  # Known-vulnerability scan of what the binary actually links (stdlib
  # included). Its own job, NOT the required `check`: a fresh stdlib advisory
  # would otherwise turn every open PR red for a reason the PR can't fix —
  # the fix is bumping the `toolchain` line in go.mod, which is what this job
  # exists to flag. Symbol-level, so advisories in code we don't call are
  # informational only.
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The grid behaviour (resize, drag-and-drop reorder, Fit columns,
  # persistence) lives in app.js, which no Go test ever loads. This job runs
  # scripts/test-grids.cjs in headless Chromium against synthetic tables; it
  # needs no database or running instance. Required alongside `check`.
  #
  # Playwright is not a package.json dependency (the repo has no Node
  # toolchain), so the version is pinned here by hand; bump it together with
  # a Chromium that the script still passes on. The runner's own Node is
  # recent enough and avoids another pinned action.
  grid:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_VERSION: 1.62.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/grid" --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/grid/node_modules/.bin/playwright" install --with-deps chromium

      - name: Grid browser test
        run: NODE_PATH="$RUNNER_TEMP/grid/node_modules" node scripts/test-grids.cjs
