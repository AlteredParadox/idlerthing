# SonarQube Cloud analysis on every push and pull request.
#
# Cloud, not a self-hosted server: the repo is public, so SonarQube Cloud is
# free and needs no runner. Only SONAR_TOKEN is required — do NOT set
# SONAR_HOST_URL, which is for self-hosted instances only (setting it points
# the scanner away from sonarcloud.io). The organization and project keys
# live in sonar-project.properties.
#
# IMPORTANT: this job imports Go coverage (coverage.out), which requires
# CI-based analysis — so Automatic Analysis MUST be turned off for the
# project in SonarQube Cloud (Administration -> Analysis Method), or the
# scan is rejected as a conflicting analysis.
name: sonarqube

# push only on main; branch pushes are covered by their pull_request run,
# so PRs (including Dependabot's) don't run this twice.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege: read-only. This job hands SONAR_TOKEN to a third-party
# action, so every action is pinned to a full commit SHA — a retagged action
# must not be able to exfiltrate the secret.
permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    # Dependabot's event token can't read SONAR_TOKEN (GitHub scopes it to a
    # separate dependabot secret store), and neither can a fork PR's. A scan
    # would fail on auth alone, so skip it — ci.yml is still the gate there.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: SonarQube needs blame data for new-code periods.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # -covermode=atomic because the suite runs concurrent handlers.
      - name: Go tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      # Record the version with every analysis. Without it SonarQube has no
      # version boundaries, so a "previous version" New Code definition has
      # nothing to compare against and silently degrades to "the whole
      # project" — which is what made the gate grade total coverage against
      # an 80% NEW-code bar. fetch-depth: 0 above makes describe work.
      - name: Resolve version
        id: ver
        run: echo "v=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - name: SonarQube Cloud scan
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: -Dsonar.projectVersion=${{ steps.ver.outputs.v }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
