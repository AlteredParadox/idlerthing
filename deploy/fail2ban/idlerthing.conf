# fail2ban filter for idlerthing login abuse.
#
# Install:  /etc/fail2ban/filter.d/idlerthing.conf
# Pairs with deploy/fail2ban/jail.local (backend = systemd).
#
# Matches idlerthing's login lines on stderr / the journal. The binary calls
# log.SetFlags(0) (journald stamps entries itself), so the message is exactly:
#
#   WARN login: failed authentication from=203.0.113.7 user=someone@example.com
#   WARN login: rate-limited from=203.0.113.7
#   WARN login: failed password-change verification from=203.0.113.7
#   INFO login: authenticated from=203.0.113.7 user=admin@localhost
#   WARN login: limiter saturated, refusing unfamiliar sources
#
# The last one carries no address on purpose: it means too many DISTINCT
# sources hit the login form at once, and the sources refused for capacity
# did nothing individually wrong (one of them may be the owner).
#
# fail2ban's systemd backend does not hand the filter the bare message: it
# formats each entry syslog-style as "<host> idlerthing[<pid>]: <message>".
# common.conf's __prefix_line absorbs that (and is all-optional, so a bare
# message from a plain log file matches too). Verify against the live
# journal with:
#   fail2ban-regex systemd-journal /etc/fail2ban/filter.d/idlerthing.conf
#
# The address is idlerthing's rate-limiter source key, which is the REAL
# client address only when IDLER_BEHIND_TLS_PROXY is set AND the reverse proxy
# appends the client to X-Forwarded-For. Otherwise it is the proxy's own
# address — fix that before relying on this, or you will ban your proxy.

[INCLUDES]
before = common.conf

[Definition]

# The journal's SYSLOG_IDENTIFIER: the executable name. Adjust if the binary
# is installed under another name.
_daemon = idlerthing

# <ADDR> is anchored immediately after "from=" and terminated by whitespace or
# end-of-line. The source is always a literal IP address (idlerthing validates
# a forwarded value before logging it), so <ADDR> rather than <HOST>: no DNS
# resolution of a captured value. The attacker-controlled username is only
# ever emitted AFTER the address (and slog quotes/escapes it), so a crafted
# value cannot shift the capture or forge a leading line.
failregex = ^%(__prefix_line)sWARN login: failed authentication from=<ADDR>(\s|$)
            ^%(__prefix_line)sWARN login: rate-limited from=<ADDR>$
            ^%(__prefix_line)sWARN login: failed password-change verification from=<ADDR>$

# A successful login is audited in the same stream, but is not a failure.
ignoreregex = ^%(__prefix_line)sINFO login: authenticated from=
