{{define "content"}}
{{$v := .Data}}
{{$h := $v.Hosting}}
<header class="page-head">
  <div>
    <h1>{{.Title}}</h1>
    {{if $v.IsEdit}}<div class="page-sub mono">{{$h.MainDomain}}</div>{{end}}
  </div>
</header>

<form method="post" action="{{$v.Action}}" class="form-sections">
  <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">

  <section class="panel form-section">
    <h2 class="section-title">Basics</h2>
    <div class="form-grid">
      <label class="field span-2">
        <span class="field-label">Main domain *</span>
        <input type="text" name="main_domain" value="{{$h.MainDomain}}" required>
        {{with index $v.Errors "main_domain"}}<span class="field-err">{{.}}</span>{{end}}
      </label>
      <label class="field">
        <span class="field-label">{{$v.TypeLabel}}</span>
        <input type="text" name="svc_type" value="{{nstr $h.SharedType}}" placeholder="e.g. cPanel, Plesk">
      </label>
      <label class="field">
        <span class="field-label">Owned since</span>
        <input type="date" name="owned_since" value="{{nstr $h.OwnedSince}}">
        {{with index $v.Errors "owned_since"}}<span class="field-err">{{.}}</span>{{end}}
      </label>
      {{template "flags_field" $h}}
    </div>
  </section>

  <section class="panel form-section">
    <h2 class="section-title">Limits</h2>
    <div class="form-grid">
      <label class="field">
        <span class="field-label">Domains</span>
        <input type="number" name="domains_limit" min="0" value="{{nint $h.DomainsLimit}}">
        {{with index $v.Errors "domains_limit"}}<span class="field-err">{{.}}</span>{{end}}
      </label>
      <label class="field">
        <span class="field-label">Subdomains</span>
        <input type="number" name="subdomains_limit" min="0" value="{{nint $h.SubdomainsLimit}}">
        {{with index $v.Errors "subdomains_limit"}}<span class="field-err">{{.}}</span>{{end}}
      </label>
      <label class="field">
        <span class="field-label">FTP accounts</span>
        <input type="number" name="ftp_limit" min="0" value="{{nint $h.FtpLimit}}">
        {{with index $v.Errors "ftp_limit"}}<span class="field-err">{{.}}</span>{{end}}
      </label>
      <label class="field">
        <span class="field-label">Email accounts</span>
        <input type="number" name="email_limit" min="0" value="{{nint $h.EmailLimit}}">
        {{with index $v.Errors "email_limit"}}<span class="field-err">{{.}}</span>{{end}}
      </label>
      <label class="field">
        <span class="field-label">Databases</span>
        <input type="number" name="db_limit" min="0" value="{{nint $h.DbLimit}}">
        {{with index $v.Errors "db_limit"}}<span class="field-err">{{.}}</span>{{end}}
      </label>
    </div>
  </section>

  <section class="panel form-section">
    <h2 class="section-title">Resources</h2>
    <div class="form-grid">
      <label class="field">
        <span class="field-label">Disk</span>
        {{template "size_input" dict "name" "disk_as_mb" "val" $h.DiskAsMB}}
        {{with index $v.Errors "disk_as_mb"}}<span class="field-err">{{.}}</span>{{end}}
      </label>
      <label class="field">
        <span class="field-label">Bandwidth</span>
        {{template "size_input" dict "name" "bandwidth_as_mb" "val" $h.BandwidthAsMB "unlimited" true}}
        {{with index $v.Errors "bandwidth_as_mb"}}<span class="field-err">{{.}}</span>{{end}}
      </label>
      <label class="field">
        <span class="field-label">IP</span>
        <input type="text" name="ip" value="{{nstr $h.IP}}">
      </label>
      <div class="field">
        <span class="field-label">Dedicated IP</span>
        <div class="check-row">
          <label class="check"><input type="checkbox" name="has_dedicated_ip" {{if $h.HasDedicatedIP}}checked{{end}}> Has dedicated IP</label>
        </div>
      </div>
    </div>
  </section>

  <section class="panel form-section">
    <h2 class="section-title">Classification</h2>
    <div class="form-grid">
      <label class="field">
        <span class="field-label">Provider</span>
        <select name="provider_id">
          <option value="">—</option>
          {{range $v.Providers}}
          <option value="{{.ID}}" {{if eq $h.ProviderID.Int64 .ID}}selected{{end}}>{{.Name}}</option>
          {{end}}
        </select>
        <a class="field-hint" href="/catalogs/providers" target="_blank">+ New provider</a>
      </label>
      <label class="field">
        <span class="field-label">Location</span>
        <select name="location_id">
          <option value="">—</option>
          {{range $v.Locations}}
          <option value="{{.ID}}" {{if eq $h.LocationID.Int64 .ID}}selected{{end}}>{{.Name}}</option>
          {{end}}
        </select>
        <a class="field-hint" href="/catalogs/locations" target="_blank">+ New location</a>
      </label>
    </div>
  </section>

  {{template "pricing_fields" $v}}

  <div class="form-actions">
    <button class="btn btn-primary" type="submit">{{if $v.IsEdit}}Save changes{{else}}Add{{end}}</button>
    <a class="btn" href="{{$v.CancelURL}}">Cancel</a>
  </div>
</form>
{{end}}
