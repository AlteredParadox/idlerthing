# SonarQube Cloud scanner configuration (run by CI on every push and PR;
# see .github/workflows/sonarqube.yml).
#
# SonarQube Cloud requires sonar.organization and namespaces the project key
# as <owner>_<repo>. Both are confirmed against the values Cloud assigned at
# import (Administration -> Information).
sonar.organization=alteredparadox
sonar.projectKey=AlteredParadox_idlerthing
sonar.projectName=idlerthing
sonar.sourceEncoding=UTF-8

# Standard Go layout: everything is a source, *_test.go is the test set.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Exclusions, each for a concrete reason:
#   *_test.go                  — the test set (declared above), not sources.
#   internal/db/migrations/*.sql — SQLite migrations. Cloud has no SQLite
#       analyzer, so leaving them in scope only makes the PL/SQL sensor run
#       and emit a spurious "Data Dictionary not configured" warning while
#       analysing them in the wrong dialect.
#   htmx.min.js                — vendored, minified third-party bundle.
#   fonts/**                   — binary woff2 (trips the encoding check).
sonar.exclusions=**/*_test.go,internal/db/migrations/*.sql,internal/web/assets/static/htmx.min.js,internal/web/assets/static/fonts/**

# Go coverage from `go test -coverprofile` (produced by the workflow).
sonar.go.coverage.reportPaths=coverage.out

# Coverage is imported for Go ONLY — there is no JS test runner here and the
# hand-written front-end is progressive enhancement driven by htmx attributes,
# so app.js lines are uncoverable BY DEFINITION. Left in the denominator they
# are pure noise: a two-line edit to app.js counted as 7 new uncovered lines
# and dragged new-code coverage down on its own. This is a COVERAGE exclusion
# only — app.js stays in sonar.sources and is still analysed for bugs and
# smells (it is how S3504/S6582 were found).
sonar.coverage.exclusions=internal/web/assets/static/app.js

# Deliberate rule exceptions belong HERE, not in the Cloud UI: issue
# resolutions live in the server's database and do not survive a project or
# platform move, whereas this file is in git. Add them as
# sonar.issue.ignore.multicriteria entries with a comment saying why.
# Caveat: multicriteria suppresses a rule for the whole FILE, not one line —
# so each entry below is scoped to the narrowest file list that covers it,
# never a broad glob, to keep future genuine findings visible.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,c1,c2,c3,c4,c5,c6,c7,c8,c9,c10,c11,c12,c13,c14,c15,c16,c17,c18,c19

# e1: "dynamically formatted SQL". Every interpolated fragment is a
# compile-time constant — a table/column name from a fixed map
# (model.ServiceTable, model.Catalogs, CatalogKind), a store struct's own
# literal, or a generated UNION over model.OrderedServiceTypes. No user
# input reaches any of them; all VALUES are bound parameters. The polymorphic
# service tables make this unavoidable without a query builder.
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e1.resourceKey=internal/db/migrate.go
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e2.resourceKey=internal/model/*.go
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e3.resourceKey=internal/importer/importer.go
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e4.resourceKey=internal/web/*.go

# e5: "omitting the Secure flag". Every cookie the app sets routes its Secure
# attribute through Server.cookieSecure(r) (TLS directly, or
# IDLER_BEHIND_TLS_PROXY behind an HTTPS-terminating proxy). The analyser
# cannot see a conditional value and assumes it is absent.
sonar.issue.ignore.multicriteria.e5.ruleKey=go:S2092
sonar.issue.ignore.multicriteria.e5.resourceKey=internal/web/*.go

# e6: "revoke this secret". The flagged literal is the input to a bcrypt hash
# computed at startup and compared against on UNKNOWN-email logins, purely so
# a failed login costs the same time whether the address exists or not. It
# authenticates nothing and grants nothing.
sonar.issue.ignore.multicriteria.e6.ruleKey=go:S6437
sonar.issue.ignore.multicriteria.e6.resourceKey=internal/web/auth.go

# e7: "redirect based on user-controlled data" — redirectBack. The value is
# rejected unless it parses with no scheme and no host, contains no
# backslash (browsers normalise /\evil.com to //evil.com), and starts with a
# single "/". That is same-origin-path-only; there is no open redirect.
sonar.issue.ignore.multicriteria.e7.ruleKey=gosecurity:S5146
sonar.issue.ignore.multicriteria.e7.resourceKey=internal/web/extras.go

# e8: "add defer tx.Rollback() after BeginTx". snapshot() RETURNS the tx to
# its caller precisely so the caller owns its lifetime; both callers
# (handleExportJSON, handleExportCSV) defer the rollback on the next line and
# commit explicitly. The analyser cannot follow a tx across a return.
sonar.issue.ignore.multicriteria.e8.ruleKey=godre:S8168
sonar.issue.ignore.multicriteria.e8.resourceKey=internal/web/export.go

# e9: "use the available ctx instead of a new background context". The
# detached context is the POINT: Rates.Get singleflights, and the leader
# fetching on its own request context meant one client disconnecting killed
# the fetch for every follower waiting on it AND armed the 60s negative-cache
# backoff. The detached context carries its own 5s timeout.
sonar.issue.ignore.multicriteria.e9.ruleKey=godre:S8239
sonar.issue.ignore.multicriteria.e9.resourceKey=internal/pricing/convert.go

# e10: cognitive complexity in TESTS ONLY (production files are deliberately
# NOT suppressed — see the note at the end of this file). Table-driven tests
# are the house style, and the metric counts every table row and per-step
# assertion against the single test function, which is the shape we want.
sonar.issue.ignore.multicriteria.e10.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e10.resourceKey=**/*_test.go

# e11: "unnecessary variable declaration" in TESTS ONLY. The flagged pattern
# is binding a response/body once and asserting on it over several lines,
# which is clearer than inlining the call into each condition.
sonar.issue.ignore.multicriteria.e11.ruleKey=godre:S8193
sonar.issue.ignore.multicriteria.e11.resourceKey=**/*_test.go

# c1-c19: cognitive-complexity findings reviewed and accepted for these
# files (simple sequential handlers/parsers). The six worst offenders
# (ParseMyCSV + ParseMyJSON in internal/importer/myidlers.go, handleExportJSON
# in internal/web/export.go, servers() in internal/importer/importer.go,
# toModel in internal/web/api_servers.go, Migrate in internal/db/migrate.go)
# were REFACTORED below the threshold instead; those files stay visible where
# they now pass (export.go, migrate.go) — the three refactored files that
# still contain other over-threshold functions keep their exclusions.
sonar.issue.ignore.multicriteria.c1.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.c1.resourceKey=internal/importer/importer.go
sonar.issue.ignore.multicriteria.c2.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.c2.resourceKey=internal/importer/myidlers.go
