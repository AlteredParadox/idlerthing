# SonarQube Cloud scanner configuration (run by CI on every push and PR;
# see .github/workflows/sonarqube.yml).
#
# SonarQube Cloud requires sonar.organization and namespaces the project key
# as <owner>_<repo>. Both are confirmed against the values Cloud assigned at
# import (Administration -> Information).
sonar.organization=alteredparadox
sonar.projectKey=AlteredParadox_idlerthing
sonar.projectName=idlerthing
sonar.sourceEncoding=UTF-8

# Standard Go layout: everything is a source, *_test.go is the test set.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Exclusions, each for a concrete reason:
#   *_test.go                  — the test set (declared above), not sources.
#   internal/db/migrations/*.sql — SQLite migrations. Cloud has no SQLite
#       analyzer, so leaving them in scope only makes the PL/SQL sensor run
#       and emit a spurious "Data Dictionary not configured" warning while
#       analysing them in the wrong dialect.
#   htmx.min.js                — vendored, minified third-party bundle.
#   fonts/**                   — binary woff2 (trips the encoding check).
sonar.exclusions=**/*_test.go,internal/db/migrations/*.sql,internal/web/assets/static/htmx.min.js,internal/web/assets/static/fonts/**

# Go coverage from `go test -coverprofile` (produced by the workflow).
sonar.go.coverage.reportPaths=coverage.out

# Deliberate rule exceptions belong HERE, not in the Cloud UI: issue
# resolutions live in the server's database and do not survive a project or
# platform move, whereas this file is in git. Add them as
# sonar.issue.ignore.multicriteria entries with a comment saying why.
# Caveat: multicriteria suppresses a rule for the whole FILE, not one line.
